<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f7f6e4, #e4edda);
        }
        
        #cadastro {
            width: 100%;
            max-width: 400px;
            padding: 40px 35px;
            background: rgba(255, 255, 255, 0.96);
            text-align: center;
            border-radius: 26px;
            box-shadow: 0 15px 40px rgba(53, 94, 43, 0.14);
            border: 1px solid rgba(74, 124, 58, 0.15);
            transition: box-shadow 0.3s ease;
        }
        
        #cadastro:hover {
            box-shadow: 0 18px 45px rgba(53, 94, 43, 0.20);
        }
        
        h2 {
            color: #355e2b;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        
        h2::after {
            content: "";
            display: block;
            width: 55px;
            height: 4px;
            margin: 12px auto 0;
            background-color: #8aaa72;
            border-radius: 10px;
        }
        
        .textoC {
            text-align: left;
            margin-bottom: 20px;
        }
        
        p {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #355e2b;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d3dfca;
            border-radius: 12px;
            background-color: #f9fbf6;
            color: #333333;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }
        
        input:focus {
            border-color: #4a7c3a;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(74, 124, 58, 0.12);
        }
        
        #cadastrar {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background-color: #4a7c3a;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        
        #cadastrar:hover {
            background-color: #355e2b;
            box-shadow: 0 6px 15px rgba(53, 94, 43, 0.22);
            transform: translateY(-2px);
        }
        
        #cadastrar:active {
            transform: translateY(0);
            box-shadow: none;
        }
        
        #cadastrar:focus-visible {
            outline: 3px solid #a7c795;
            outline-offset: 3px;
        }
        
        @media (max-width: 420px) {
            #cadastro {
                padding: 28px 22px;
            }
            h2 {
                font-size: 26px;
            }
        }
        
        #voltarInicio {
            display: block;
            margin-top: 18px;
            color: #355e2b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        #voltarInicio:hover {
            color: #6b8e5a;
            text-decoration: underline;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f7f6e4, #e4edda);
            position: relative;
            isolation: isolate;
        }
        
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("download (1).png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: min(85vw, 700px);
            opacity: 0.35;
            z-index: -1;
            pointer-events: none;
        }
        
        #cadastro {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div id="cadastro">
        <h2>Criar conta</h2>

        <div class="textoC">
            <p>Nome:</p>
            <input id="nome" type="text">
        </div>

        <div class="textoC">
            <p>Email:</p>
            <input id="email" type="email">
        </div>

        <div class="textoC">
            <p>Senha:</p>
            <div style="position: relative;">
                <input id="senha" type="password" style="padding-right: 75px;">
                <button id="mostrarSenha" type="button" style="position: absolute; right: 8px; top: 50%;
                       transform: translateY(-50%); border: none;
                       background: transparent; color: #355e2b;
                       cursor: pointer; font-size: 13px;">Mostrar
        </button>
            </div>
        </div>
        <button id="cadastrar" type="button">Cadastrar</button>
        <a href="index.html" id="voltarInicio">Voltar para o início</a>
    </div>

    <script>
        const nome = document.getElementById("nome");
        const email = document.getElementById("email");
        const senha = document.getElementById("senha");
        const cadastrar = document.getElementById("cadastrar");


        cadastrar.addEventListener("click", function() {
            const nomeValor = nome.value.trim();
            const emailValor = email.value.trim();
            const senhaValor = senha.value;

            if (!nomeValor || !emailValor || !senhaValor) {
                alert("Preencha todos os campos!");
                return;
            }

            if (!email.checkValidity()) {
                alert("Digite um e-mail válido!");
                return;
            }

            if (senhaValor.length < 6) {
                alert("A senha deve ter pelo menos 6 caracteres!");
                return;
            }

            localStorage.setItem("nome", nomeValor);
            localStorage.setItem("email", emailValor);

            // Não salvar a senha em texto puro no localStorage.
            alert("Cadastro realizado!");
            window.location.href = "index.html";
        });
        const mostrarSenha = document.getElementById("mostrarSenha");

        mostrarSenha.addEventListener("click", function() {
            if (senha.type === "password") {
                senha.type = "text";
                mostrarSenha.textContent = "Ocultar";
            } else {
                senha.type = "password";
                mostrarSenha.textContent = "Mostrar";
            }
        });

        localStorage.setItem("cadastrado", "true");
        window.location.href = "index.html";
        
    </script>
</body>
