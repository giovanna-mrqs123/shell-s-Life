<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publicar Receita | Shell's Life</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            background: linear-gradient(135deg, #f7f6e4, #e4edda);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            isolation: isolate;
        }
        
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("download (1).png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: min(85vw, 700px);
            opacity: 0.35;
            z-index: -1;
            pointer-events: none;
        }
        
        .cartao {
            width: 100%;
            max-width: 480px;
            padding: 32px;
            background-color: rgba(255, 255, 255, 0.97);
            box-shadow: 0 12px 35px rgba(53, 94, 43, 0.14);
            border: 1px solid rgba(74, 124, 58, 0.15);
            border-radius: 24px;
        }
        
        h2 {
            text-align: center;
            color: #355e2b;
            font-size: 28px;
            font-weight: 700;
            margin: 8px 0 28px;
            letter-spacing: -0.5px;
        }
        
        h2::after {
            content: "";
            display: block;
            width: 55px;
            height: 4px;
            margin: 12px auto 0;
            background-color: #8aaa72;
            border-radius: 10px;
        }
        
        p {
            margin: 18px 0 8px;
            font-weight: 600;
            font-size: 15px;
            color: #355e2b;
        }
        
        input,
        select,
        textarea {
            display: block;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d3dfca;
            border-radius: 12px;
            background-color: #f9fbf6;
            color: #333333;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }
        
        input:focus,
        select:focus,
        textarea:focus {
            border-color: #4a7c3a;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(74, 124, 58, 0.12);
        }
        
        textarea {
            min-height: 90px;
            line-height: 1.5;
            resize: vertical;
        }
        
        .imagem {
            padding: 14px;
            border: 2px dashed #a7c795;
            background-color: #f9fbf6;
            color: #355e2b;
            font-size: 13px;
            cursor: pointer;
        }
        
        #previaImagem {
            display: none;
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 14px;
            margin-top: 12px;
        }
        
        .dica {
            margin-top: 7px;
            color: #71816a;
            font-size: 12px;
            font-weight: 400;
        }
        
        button {
            width: 100%;
            margin-top: 26px;
            padding: 14px;
            background-color: #4a7c3a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(53, 94, 43, 0.15);
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }
        
        button:hover {
            background-color: #355e2b;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(53, 94, 43, 0.22);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:focus-visible {
            outline: 3px solid #a7c795;
            outline-offset: 3px;
        }
        
        .voltar {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #355e2b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        
        .voltar:hover {
            color: #6b8e5a;
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 18px 12px;
            }
            .cartao {
                padding: 24px 18px;
                border-radius: 20px;
            }
            h2 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="cartao">
        <h2>Publicar receita</h2>

        <form id="formReceita">

            <p>Foto da receita</p>
            <input type="file" class="imagem" id="imagem" accept="image/*" required>

            <p class="dica">Escolha uma foto para mostrar sua receita.</p>

            <img id="previaImagem" alt="Prévia da foto da receita">

            <p>Nome da receita</p>
            <input type="text" class="nome" placeholder="Ex.: Salada saudável" maxlength="100" required>

            <p>Descrição</p>
            <textarea class="desc" placeholder="Conte um pouco sobre essa receita..." rows="3" maxlength="500" required></textarea>

            <p>Tempo de preparo (minutos)</p>
            <input type="number" class="tempo" placeholder="Ex.: 20" min="1" max="1440" required>

            <p>Dificuldade</p>
            <select id="dificuldade">
                <option value="Fácil">Fácil</option>
                <option value="Média">Média</option>
                <option value="Difícil">Difícil</option>
            </select>

            <p>Ingredientes</p>
            <textarea class="ingre" placeholder="Ex.:
2 ovos
1 xícara de leite
1 colher de farinha" rows="4" required></textarea>

            <p>Modo de preparo</p>
            <textarea class="modoP" placeholder="Descreva o passo a passo da receita..." rows="5" required></textarea>

            <button type="submit">Publicar receita</button>

            <a href="index.html" class="voltar">
                Voltar para o início
            </a>

        </form>
    </main>

    <script>
        const formulario = document.querySelector('#formReceita');
        const campoImagem = document.querySelector('#imagem');
        const previaImagem = document.querySelector('#previaImagem');

        let urlPreviaAtual = null;

        // Mostra a prévia da foto selecionada
        campoImagem.addEventListener('change', function() {
            const arquivo = this.files[0];

            if (urlPreviaAtual) {
                URL.revokeObjectURL(urlPreviaAtual);
                urlPreviaAtual = null;
            }

            previaImagem.removeAttribute('src');
            previaImagem.style.display = 'none';

            if (!arquivo) {
                return;
            }

            if (!arquivo.type.startsWith('image/')) {
                alert('Selecione um arquivo de imagem válido.');
                this.value = '';
                return;
            }

            urlPreviaAtual = URL.createObjectURL(arquivo);
            previaImagem.src = urlPreviaAtual;
            previaImagem.style.display = 'block';
        });

        // Publica a receita
        formulario.addEventListener('submit', function(evento) {
            evento.preventDefault();

            const nome = document.querySelector('.nome').value.trim();
            const desc = document.querySelector('.desc').value.trim();
            const tempo = document.querySelector('.tempo').value;
            const dificuldade = document.querySelector('#dificuldade').value;
            const arquivoImagem = campoImagem.files[0];
            const ingredientes = document.querySelector('.ingre').value.trim();
            const modoP = document.querySelector('.modoP').value.trim();

            if (!nome ||
                !desc ||
                !tempo ||
                Number(tempo) < 1 ||
                Number(tempo) > 1440 ||
                !arquivoImagem ||
                !ingredientes ||
                !modoP
            ) {
                alert('Preencha todos os campos corretamente.');
                return;
            }

            if (!arquivoImagem.type.startsWith('image/')) {
                alert('Selecione um arquivo de imagem válido.');
                return;
            }

            const leitor = new FileReader();

            leitor.onload = function() {
                try {
                    const receitasSalvas = localStorage.getItem('receitas');
                    const receitas = receitasSalvas ?
                        JSON.parse(receitasSalvas) : [];

                    if (!Array.isArray(receitas)) {
                        throw new Error('Os dados salvos não são uma lista.');
                    }

                    const novaReceita = {
                        nome: nome,
                        desc: desc,
                        tempo: tempo + ' min',
                        dificuldade: dificuldade,
                        imagem: leitor.result,
                        ingredientes: ingredientes,
                        modoP: modoP
                    };

                    receitas.push(novaReceita);

                    localStorage.setItem(
                        'receitas',
                        JSON.stringify(receitas)
                    );

                    alert('Receita publicada com sucesso!');
                    window.location.href = 'index.html';

                } catch (erro) {
                    console.error('Erro ao salvar a receita:', erro);
                    alert(
                        'Não foi possível salvar a receita. ' +
                        'Verifique o espaço disponível no navegador e tente novamente.'
                    );
                }
            };

            leitor.onerror = function() {
                alert('Não foi possível ler a foto. Tente selecionar outra imagem.');
            };

            leitor.readAsDataURL(arquivoImagem);
        });
    </script>

</body>

</html>
