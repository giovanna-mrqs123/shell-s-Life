<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Shell's Life</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f7f6e4, #e4edda);
            position: relative;
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("download (1).png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: min(85vw, 700px);
            opacity: 0.35;
            z-index: -1;
            pointer-events: none;
        }

        #login {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 40px 35px;
            background: rgba(255, 255, 255, 0.96);
            text-align: center;
            border-radius: 26px;
            box-shadow: 0 15px 40px rgba(53, 94, 43, 0.14);
            border: 1px solid rgba(74, 124, 58, 0.15);
            transition: box-shadow 0.3s ease;
        }

        #login:hover {
            box-shadow: 0 18px 45px rgba(53, 94, 43, 0.20);
        }

        h2 {
            color: #355e2b;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        h2::after {
            content: "";
            display: block;
            width: 55px;
            height: 4px;
            margin: 12px auto 0;
            background-color: #8aaa72;
            border-radius: 10px;
        }

        .textoC {
            text-align: left;
            margin-bottom: 20px;
        }

        p {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #355e2b;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d3dfca;
            border-radius: 12px;
            background-color: #f9fbf6;
            color: #333333;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        input:focus {
            border-color: #4a7c3a;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(74, 124, 58, 0.12);
        }

        #entrar {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background-color: #4a7c3a;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #entrar:hover {
            background-color: #355e2b;
            box-shadow: 0 6px 15px rgba(53, 94, 43, 0.22);
            transform: translateY(-2px);
        }

        #entrar:active {
            transform: translateY(0);
            box-shadow: none;
        }

        #entrar:focus-visible {
            outline: 3px solid #a7c795;
            outline-offset: 3px;
        }

        #mensagemErro {
            display: none;
            margin-bottom: 20px;
            padding: 12px 14px;
            border-radius: 12px;
            background-color: #fbeaea;
            border: 1px solid #e6bcbc;
            color: #853633;
            font-size: 14px;
            font-weight: 600;
            text-align: left;
        }

        .link {
            display: block;
            margin-top: 18px;
            color: #355e2b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .link:hover {
            color: #6b8e5a;
            text-decoration: underline;
        }

        @media (max-width: 420px) {
            #login {
                padding: 28px 22px;
            }

            h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <form id="login" action="login.php" method="POST">
        <h2>Entrar</h2>

        <div id="mensagemErro" role="alert"></div>

        <div class="textoC">
            <p>Email:</p>
            <input id="email" name="email" type="email" required autocomplete="email">
        </div>

        <div class="textoC">
            <p>Senha:</p>
            <div style="position: relative;">
                <input id="senha" name="senha" type="password" required autocomplete="current-password" style="padding-right: 75px;">
                <button id="mostrarSenha" type="button" style="position: absolute; right: 8px; top: 50%;
                       transform: translateY(-50%); border: none;
                       background: transparent; color: #355e2b;
                       cursor: pointer; font-size: 13px;">Mostrar</button>
            </div>
        </div>

        <button id="entrar" type="submit">Entrar</button>

        <a href="cadastro.html" class="link">Não tem conta? Cadastre-se</a>
        <a href="index.php" class="link">Voltar para o início</a>
    </form>

    <script>
        const campoSenha = document.getElementById("senha");
        const botaoMostrar = document.getElementById("mostrarSenha");

        botaoMostrar.addEventListener("click", function() {
            if (campoSenha.type === "password") {
                campoSenha.type = "text";
                botaoMostrar.textContent = "Ocultar";
            } else {
                campoSenha.type = "password";
                botaoMostrar.textContent = "Mostrar";
            }
        });

        // Mostra a mensagem de erro enviada pelo login.php
        const mensagens = {
            invalido: "E-mail ou senha incorretos.",
            campos: "Preencha o e-mail e a senha."
        };

        const erro = new URLSearchParams(window.location.search).get("erro");

        if (erro && mensagens[erro]) {
            const caixa = document.getElementById("mensagemErro");
            caixa.textContent = mensagens[erro];
            caixa.style.display = "block";
        }
    </script>
</body>

</html>
